services:
    php:
        image: ghcr.io/sylius/sylius-php:8.4-alpine
    mysql:
        image: mysql:8.4
        platform: linux/amd64
        healthcheck:
            test: '/usr/bin/mysql --execute "SHOW databases;"'
            timeout: 3s
            interval: 1s
            retries: 10
        environment:
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
        cap_add:
            - SYS_NICE
    nginx:
        image: ghcr.io/sylius/sylius-nginx:latest
        depends_on:
            - php
    chrome:
        image: zenika/alpine-chrome:latest
        # The PHP container's network: Behat reaches Chrome on 127.0.0.1:9222, as behat.dist.php expects.
        network_mode: service:php
        command:
            - --no-sandbox
            - --disable-gpu
            - --disable-dev-shm-usage
            - --remote-debugging-address=0.0.0.0
            - --remote-debugging-port=9222
            - about:blank
        depends_on:
            - php
