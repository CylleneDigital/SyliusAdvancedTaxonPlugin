name: Build

on:
    push:
        branches-ignore:
            - 'dependabot/**'
        paths-ignore:
            - "**/*.md"
    pull_request:
        paths-ignore:
            - "**/*.md"
    release:
        types: [created]
    schedule:
        -
            cron: "0 1 * * 6" # Run at 1am every Saturday
    workflow_dispatch: ~

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    tests:
        runs-on: ubuntu-latest

        name: "Sylius ${{ matrix.sylius }}, PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }}, ${{ matrix.database }}"

        strategy:
            fail-fast: false
            matrix:
                php: ["8.3", "8.4"]
                symfony: ["^7.4"]
                sylius: ["~2.2.0", "~2.3.0"]
                database: ["mysql:8.4"]
                node: ["22.x"]

                include:
                    # Symfony 8 only ships with Sylius 2.3 and needs PHP 8.4+
                    - php: "8.4"
                      symfony: "^8.0"
                      sylius: "~2.3.0"
                      database: "mysql:8.4"
                      node: "22.x"
                    # Extra databases on the primary supported combination
                    - php: "8.4"
                      symfony: "^7.4"
                      sylius: "~2.3.0"
                      database: "mysql:8.0"
                      node: "22.x"
                    - php: "8.4"
                      symfony: "^7.4"
                      sylius: "~2.3.0"
                      database: "mariadb:10.11"
                      node: "22.x"
                    - php: "8.4"
                      symfony: "^7.4"
                      sylius: "~2.3.0"
                      database: "mariadb:11.4"
                      node: "22.x"
                    - php: "8.4"
                      symfony: "^7.4"
                      sylius: "~2.3.0"
                      database: "postgres:15"
                      node: "22.x"
                    - php: "8.4"
                      symfony: "^7.4"
                      sylius: "~2.3.0"
                      database: "postgres:16"
                      node: "22.x"
                    - php: "8.4"
                      symfony: "^7.4"
                      sylius: "~2.3.0"
                      database: "postgres:17"
                      node: "22.x"

        env:
            APP_ENV: test

        steps:
            -
                uses: actions/checkout@v7

            -
                name: Build Sylius Test Application
                uses: SyliusLabs/BuildTestAppAction@v4
                with:
                    # The admin and shop pages the tests render include the Webpack Encore entries:
                    # without a front-end build they answer 500 without saying why.
                    e2e_js: "yes"
                    cache_key: "${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('**/composer.json') }}"
                    cache_restore_key: "${{ runner.os }}-php-${{ matrix.php }}-composer-"
                    database: "${{ matrix.database }}"
                    node_version: "${{ matrix.node }}"
                    php_version: "${{ matrix.php }}"
                    sylius_version: "${{ matrix.sylius }}"
                    symfony_version: "${{ matrix.symfony }}"

            -
                name: Validate composer.json
                run: composer validate --ansi --strict

            # Catches wiring errors before the tests that depend on them: on a plugin, that is the
            # most frequent class of bug.
            -
                name: Validate container
                run: vendor/bin/console lint:container --env=test

            # Static analysis, coding standard and template linting do not depend on the database
            # nor on the PHP version line under test, so they only run once, on the primary job.
            -
                name: Run PHPStan
                if: matrix.php == '8.4' && matrix.symfony == '^7.4' && matrix.sylius == '~2.3.0' && matrix.database == 'mysql:8.4'
                run: vendor/bin/phpstan analyse --ansi --no-progress

            -
                name: Run ECS
                if: matrix.php == '8.4' && matrix.symfony == '^7.4' && matrix.sylius == '~2.3.0' && matrix.database == 'mysql:8.4'
                run: vendor/bin/ecs check --ansi --no-progress-bar

            -
                name: Lint templates
                if: matrix.php == '8.4' && matrix.symfony == '^7.4' && matrix.sylius == '~2.3.0' && matrix.database == 'mysql:8.4'
                run: vendor/bin/console lint:twig templates --env=test

            -
                name: Run unit tests
                run: vendor/bin/phpunit --colors=always --testsuite=unit

            -
                name: Run Non-unit PHPUnit tests
                run: vendor/bin/phpunit --colors=always --testsuite=non-unit

            -
                name: Run Behat
                run: vendor/bin/behat --colors --strict -vvv --no-interaction -f progress || vendor/bin/behat --colors --strict -vvv --no-interaction -f progress --rerun

            -
                name: Upload Behat logs
                uses: actions/upload-artifact@v7
                if: failure()
                with:
                    name: "Behat logs - Sylius ${{ matrix.sylius }} - ${{ matrix.database }} - ${{ github.run_id }}"
                    path: etc/build/
                    if-no-files-found: ignore
                    compression-level: 6
                    overwrite: true

    # The matrix jobs carry generated names, which change with the matrix itself. This one has a
    # fixed name and is the only check the branch rule has to require.
    #
    # `always()` matters: without it the job is skipped when a matrix job fails, and a skipped
    # required check counts as satisfied - the rule would let through exactly what it guards
    # against.
    build:
        runs-on: ubuntu-latest
        name: "Build complete"
        needs: tests
        if: always()

        steps:
            -
                name: Fail unless every matrix job succeeded
                run: |
                    [ "${{ needs.tests.result }}" = "success" ] || exit 1
