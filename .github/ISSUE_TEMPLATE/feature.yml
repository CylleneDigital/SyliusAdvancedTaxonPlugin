name: Suggest an improvement
description: A feature or an enhancement
labels: ["enhancement"]
body:
    - type: textarea
      id: problem
      attributes:
          label: The need
          description: "What concrete problem are you running into? Describe the situation, not the solution."
      validations:
          required: true
    - type: textarea
      id: proposal
      attributes:
          label: What you suggest
    - type: dropdown
      id: scope
      attributes:
          label: This concerns
          options:
              - The taxon model and the back-office form
              - The storefront rendering (taxon page, media zones, filters)
              - The universe pages
              - The mega menu
              - Conditional taxons and mass assignment
              - The documentation
              - Something else
      validations:
          required: true
    - type: markdown
      attributes:
          value: |
              For a storefront change, a screenshot or a link to the screen concerned makes the
              request much easier to understand.
