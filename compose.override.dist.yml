services:
    php:
        # The host user: PHP-FPM and the console then write var/ with the same owner, yours.
        user: ${DOCKER_USER:-1000:1000}
        volumes:
            - .:/app:rw,cached
        working_dir: /app
        environment:
            APP_ENV: test
            PHP_DATE_TIMEZONE: ${PHP_DATE_TIMEZONE:-UTC}
            DATABASE_URL: mysql://root@mysql/cyllene_digital_sylius_advanced_taxon_plugin_test
            BEHAT_BASE_URL: http://nginx/
        depends_on:
            mysql:
                condition: service_healthy
    mysql:
        # Host 3306 is often already taken; Behat talks to mysql:3306 on the Compose network.
        ports:
            - "3307:3306"
        environment:
            MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
            MYSQL_DATABASE: cyllene_digital_sylius_advanced_taxon_plugin_test
    nginx:
        ports:
            - "8080:80"
        environment:
            # The image serves ${WORKING_DIR}/public: the test application's, not the plugin's.
            WORKING_DIR: /app/vendor/sylius/test-application
        volumes:
            - .:/app:rw,cached
        depends_on:
            - php
